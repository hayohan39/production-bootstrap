# 의존성 업데이트 PR. 일주일에 한 번, 묶어서 올린다(PR 홍수 방지).
# Dependabot PR 도 CI · Risk Score 를 거친다. Dependabot 이 연 PR 의 워크플로에는 시크릿이 없어서
# AI 리뷰와 auto-fix 는 건너뛰고 규칙 기반 점수만 붙는다.
#
# 메이저 업그레이드를 막아 둔 것(ignore)은 생태계가 따라오지 않아 CI 가 깨지는 것들이다.
# 지원이 생기면 그 줄을 지우고 사람이 직접 올린다(세션에서 "eslint 10 으로 올려줘").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-config-next 의 플러그인(react, import, jsx-a11y)이 ESLint 10 을 지원하지 않는다.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # typescript-eslint 가 TypeScript 7 을 지원하지 않는다.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # 런타임이 Node 24(.nvmrc, engines)라서 타입도 24 에 맞춘다. 런타임을 올릴 때 같이 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
