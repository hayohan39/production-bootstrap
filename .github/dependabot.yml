# 의존성 업데이트 PR. 일주일에 한 번, 묶어서 올린다(PR 홍수 방지).
# Dependabot PR 도 CI · Risk Score 를 거친다. Dependabot 이 연 PR 의 워크플로에는 시크릿이 없어서
# AI 리뷰는 건너뛰고 규칙 기반 점수만 붙는다(메이저 업그레이드는 Compatibility 가 오른다).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
