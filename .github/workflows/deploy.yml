name: Deploy
# 배포한 커밋을 실행 이름에 남긴다. workflow_run 으로 시작한 실행의 head_sha 는 배포한 커밋이 아니라 그 순간의 main 이라서,
# "마지막으로 성공한 배포" 는 이 이름에서 읽는다(아래 Changed since the last successful deploy).
run-name: Deploy ${{ github.event.workflow_run.head_sha || github.sha }}

# main 에 merge 되면 → CI 의 test 가 merge 결과물을 다시 검사하고 → 통과하면 프로덕션에 배포한다.
# test 가 실패하거나 취소되면(뒤이은 merge 가 CI 를 취소) 배포하지 않는다 — 다음 merge 의 배포가 그 코드까지 포함한다.
# 문서만 바뀐 merge(scripts/ci-changes.mjs)는 배포하지 않는다. 비교 기준은 직전 push 가 아니라 **마지막으로 성공한 배포**다
# (앞선 배포가 실패했으면 그 코드까지 포함해서 판정한다).
#
#   migrate  (대기 중인 마이그레이션이 있으면) Neon 스냅샷 브랜치 pre-deploy/<sha> → 프로덕션 DB 마이그레이션
#   deploy   프로덕션 빌드를 도메인 연결 없이 배포(--skip-domain) → 그 URL 로 스모크 테스트
#            → promote(트래픽 전환) → 프로덕션 도메인 헬스체크(새 커밋인지까지)
#            → 실패하면 직전 배포로 자동 롤백 → merge 된 PR 에 결과 코멘트
#
# DB 는 자동으로 되돌리지 않는다. 그래서 스키마 변경은 expand → contract 로 나눈다(.github/risk/rubric.md).
# 복구 절차는 docs/runbook.md.
#
# Vercel 의 Git 자동배포는 쓰지 않는다(프로젝트를 Git 에 연결하지 않음). 배포가 반드시 마이그레이션 뒤에
# 일어나도록 순서를 이 워크플로가 쥐고 있기 위해서다.
#
# 필요한 값이 아직 없으면(프로비저닝 전) 실패시키지 않고 무엇이 없는지 알린 뒤 건너뛴다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # 배포할 커밋: CI 가 검사한 main 커밋(workflow_run) 또는 수동 실행한 커밋.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  migrate:
    name: Database migrate
    # 템플릿 리포지토리 자신은 배포하지 않는다. CI(main push)가 성공했을 때만.
    if: >-
      !github.event.repository.is_template
      && (github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    # 마이그레이션 도중 끊기면 더 아프다(CREATE INDEX CONCURRENTLY 가 끊기면 INVALID 인덱스가 남는다). 러너가 문장마다
    # statement_timeout(기본 5분, MIGRATION_STATEMENT_TIMEOUT)을 걸어 보통은 그쪽이 먼저 끊고 안내를 남긴다. 이 상한은 멈춤 대비용이다.
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      actions: read # 마지막으로 성공한 배포 찾기
    outputs:
      snapshot: ${{ steps.snapshot.outputs.snapshot_name }}
      applied: ${{ steps.pending.outputs.pending }}
      code: ${{ steps.changes.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      # 수동 실행(workflow_dispatch)은 항상 배포한다. 성공한 배포가 없으면(첫 배포) base 가 비어 code=true.
      # 배포한 커밋은 실행 이름(run-name)에서 읽는다. 이름에 커밋이 없는 옛 실행(push 로 시작)은 head_sha 가 그 커밋이다.
      - name: Changed since the last successful deploy
        id: changes
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=20" \
            --jq '[.workflow_runs[] | ((.display_title | capture("(?<s>[0-9a-f]{40})") | .s)? // .head_sha)][0] // empty' || true)
          echo "마지막 성공 배포: ${last:-(없음)}"
          node scripts/ci-changes.mjs --base "$last" --head "$DEPLOY_SHA"

      - name: Check database configuration
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CODE: ${{ steps.changes.outputs.code || 'true' }}
        run: |
          if [ "$CODE" != true ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### 📝 문서만 바뀜 — 배포를 건너뜁니다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ 마이그레이션 건너뜀"
              echo ""
              echo "\`DATABASE_URL\` 시크릿이 없습니다. 프로비저닝이 끝나지 않은 프로젝트입니다."
              echo "production-bootstrap 의 new-project 워크플로를 같은 이름으로 다시 실행하면 채워집니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! ls migrations/*.sql >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "마이그레이션 파일이 없습니다. 건너뜁니다."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Pending migrations
        id: pending
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          out=$(npm run --silent migrate:status)
          echo "$out"
          if grep -q '대기 중' <<<"$out"; then echo "pending=true" >> "$GITHUB_OUTPUT"; else echo "pending=false" >> "$GITHUB_OUTPUT"; fi

      # 되돌릴 수 없는 일이 생겨도 마이그레이션 직전 상태로 돌아갈 수 있게 copy-on-write 스냅샷을 남긴다.
      # 실패하면 마이그레이션도 하지 않는다(변수 PREDEPLOY_SNAPSHOTS=0 으로 끌 수 있다).
      - name: Snapshot production database
        id: snapshot
        if: steps.pending.outputs.pending == 'true' && vars.PREDEPLOY_SNAPSHOTS != '0'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          KEEP: ${{ vars.PREDEPLOY_SNAPSHOTS || '3' }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::Neon 설정이 없어 스냅샷을 건너뜁니다(PITR 로만 복구 가능)."
            exit 0
          fi
          node scripts/neon.mjs snapshot-create --sha "$DEPLOY_SHA" --keep "$KEEP"

      - name: Apply migrations
        if: steps.pending.outputs.pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "마이그레이션 시작: $(date -u +%Y-%m-%dT%H:%M:%SZ) (PITR 복구 기준 시각)" | tee -a "$GITHUB_STEP_SUMMARY"
          npm run migrate

  deploy:
    name: Vercel production deploy
    needs: [migrate]
    # 마이그레이션이 실패하면 배포하지 않는다. 문서만 바뀐 merge·CI 실패(migrate job 이 건너뜀)도 배포하지 않는다.
    if: >-
      always()
      && !github.event.repository.is_template
      && needs.migrate.result == 'success'
      && needs.migrate.outputs.code != 'false'
    runs-on: ubuntu-latest
    # 아래 단계마다 상한을 따로 둔다: 멈춘 단계가 '실패' 로 끝나야 자동 롤백(if: failure() && health 실패)이 돈다.
    # job 상한은 그 합(42분)에 준비 단계까지 더해도 넉넉한 마지막 안전망이다(job 이 취소되면 롤백 단계는 돌지 않는다).
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      deployments: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check Vercel configuration
        id: guard
        run: |
          missing=()
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Vercel 배포 건너뜀"
              echo ""
              echo "없는 값: \`${missing[*]}\`"
              echo "production-bootstrap 의 new-project 워크플로를 같은 이름으로 다시 실행하면 채워집니다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install --global vercel@latest >/dev/null

      # 자동 롤백 대상: 지금 프로덕션에서 돌고 있는(마지막으로 성공한) 배포.
      - name: Remember current production
        id: current
        if: steps.guard.outputs.ready == 'true'
        run: |
          url=$(node scripts/release.mjs last-good || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "현재 프로덕션: ${url:-없음(첫 배포)}"

      # 프로덕션 환경변수로 빌드하지만 도메인은 아직 옮기지 않는다(스테이징 단계).
      - name: Deploy (staged)
        id: deploy
        if: steps.guard.outputs.ready == 'true'
        timeout-minutes: 15
        run: |
          # --yes: 배포 이력이 없는 새 프로젝트의 첫 배포에서 CLI 가 대화형 확인을 물으려다 실패하는 것을 막는다.
          url=$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN" \
            --env APP_COMMIT_SHA="$DEPLOY_SHA" --build-env SENTRY_RELEASE="$DEPLOY_SHA" \
            --meta githubCommitSha="$DEPLOY_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "스테이징 배포: $url"

      - name: Smoke test (staged)
        id: smoke
        if: steps.deploy.outcome == 'success'
        timeout-minutes: 5
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET 이 없어 스테이징 스모크 테스트를 건너뜁니다. 승격 후 헬스체크만 합니다."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/smoke.mjs "$URL" --sha "$DEPLOY_SHA"
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Promote to production
        id: promote
        if: steps.smoke.outcome == 'success'
        timeout-minutes: 8
        # 승격 단계가 실패해도(상태 확인 오류·시간 초과) 트래픽은 옮겨졌을 수 있다. 성패는 아래 헬스체크가 정한다 —
        # 운영 도메인이 새 커밋을 정상으로 내보내면 성공(배포 기록도 성공 → 다음 롤백 대상이 맞게 잡힌다).
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
        # vercel promote CLI 는 토큰의 "사용자" 조회부터 해서 토큰에 따라(팀 범위 등) User not found 로 실패한다 → REST API (scripts/release.mjs)
        run: node scripts/release.mjs promote "$URL"

      # 프로덕션 도메인이 새 커밋을 정상으로 내보내는지까지 확인한다(약 90초 재시도 — 승격이 늦게 끝나는 경우도 기다린다).
      - name: Health check (production)
        id: health
        if: steps.promote.outcome == 'success' || steps.promote.outcome == 'failure'
        timeout-minutes: 6
        run: |
          domain=$(node scripts/release.mjs production-domain || true)
          if [ -z "$domain" ]; then
            echo "::warning::프로덕션 도메인을 찾지 못해 헬스체크를 건너뜁니다."
            [ "${{ steps.promote.outcome }}" = success ] || exit 1
            exit 0
          fi
          echo "domain=https://$domain" >> "$GITHUB_OUTPUT"
          node scripts/smoke.mjs "https://$domain" --sha "$DEPLOY_SHA" --tries 9

      # 헬스체크 실패: 운영이 새 커밋을 내보내고 있으면(= 새 배포가 문제) 직전 배포로 되돌린다.
      # 새 커밋이 아니면 트래픽이 옮겨지지 않은 것이라 되돌리지 않는다(지금 운영이 이미 이전 버전).
      - name: Roll back to previous deployment
        id: rollback
        if: failure() && steps.health.outcome == 'failure' && steps.current.outputs.url != ''
        timeout-minutes: 8
        env:
          PREVIOUS: ${{ steps.current.outputs.url }}
          DOMAIN: ${{ steps.health.outputs.domain }}
        run: |
          commit=""
          if [ -n "$DOMAIN" ]; then
            curl -sS --max-time 15 -o health.json "$DOMAIN/api/health" || true
            commit=$(node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync("health.json","utf8")).commit??""))}catch{}')
          fi
          if [ -z "$commit" ]; then
            echo "unknown=true" >> "$GITHUB_OUTPUT"
            echo "::error::운영이 어느 커밋을 내보내는지 확인하지 못했습니다 — 자동 롤백하지 않습니다."
            exit 1
          fi
          if [ "$commit" != "${DEPLOY_SHA:0:7}" ]; then
            echo "not_moved=true" >> "$GITHUB_OUTPUT"
            echo "::error::운영은 이전 커밋($commit)입니다 — 트래픽이 옮겨지지 않아 롤백하지 않습니다."
            exit 1
          fi
          echo "::error::헬스체크 실패 → $PREVIOUS 로 롤백합니다."
          node scripts/release.mjs rollback "$PREVIOUS"

      - name: Summary and PR comment
        if: always() && steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          DOMAIN: ${{ steps.health.outputs.domain }}
          SMOKE: ${{ steps.smoke.outcome }}
          PROMOTE: ${{ steps.promote.outcome }}
          NOT_MOVED: ${{ steps.rollback.outputs.not_moved }}
          UNKNOWN: ${{ steps.rollback.outputs.unknown }}
          HEALTH: ${{ steps.health.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          PREVIOUS: ${{ steps.current.outputs.url }}
          SNAPSHOT: ${{ needs.migrate.outputs.snapshot }}
          APPLIED: ${{ needs.migrate.outputs.applied }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          db=""
          if [ "$APPLIED" = "true" ]; then
            db=" · DB 마이그레이션 적용됨${SNAPSHOT:+ (스냅샷 \`$SNAPSHOT\`)}"
          fi
          if [ "$HEALTH" = "success" ]; then
            msg="🚀 프로덕션 배포 완료: ${DOMAIN:-$URL} (헬스체크 OK)$db"
            if [ "$PROMOTE" = "failure" ]; then msg+=" — 승격 단계는 오류로 끝났지만 운영 반영과 헬스체크를 확인했습니다. [로그]($RUN_URL)"; fi
          elif [ "$ROLLBACK" = "success" ]; then
            msg="↩️ 헬스체크 실패로 **자동 롤백**했습니다 → $PREVIOUS$db. DB 는 그대로입니다 — docs/runbook.md 의 '배포 실패' 를 보세요. [로그]($RUN_URL)"
          elif [ "$NOT_MOVED" = "true" ]; then
            msg="❌ 운영이 새 버전으로 바뀌지 않았습니다 — 운영은 이전 버전입니다(확인함)$db. 단 Vercel 의 승격 작업이 늦게 끝날 수 있으니 **Vercel → Deployments 에서 현재 Production 을 확인하세요**(docs/runbook.md). [로그]($RUN_URL)"
          elif [ "$UNKNOWN" = "true" ]; then
            msg="⚠️ 헬스체크 실패, 운영이 어느 버전인지 확인하지 못해 자동 롤백하지 않았습니다$db. **Vercel → Deployments 에서 현재 Production 을 확인하세요**(docs/runbook.md). [로그]($RUN_URL)"
          elif [ "$PROMOTE" = "success" ] || [ "$PROMOTE" = "failure" ]; then
            msg="🔥 배포 후 헬스체크 실패, 자동 롤백도 못 했습니다(이전 배포 기록 없음 또는 롤백 실패)$db. **docs/runbook.md 를 따라 바로 확인하세요.** [로그]($RUN_URL)"
          elif [ "$SMOKE" = "failure" ]; then
            msg="⛔ 스테이징 스모크 테스트 실패 — 트래픽은 옮기지 않았습니다(프로덕션은 이전 버전)$db. [로그]($RUN_URL)"
          else
            msg="❌ 프로덕션 배포 실패 — 트래픽은 옮기지 않았습니다$db. [로그]($RUN_URL)"
          fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty' || true)
          if [ -n "$pr" ]; then
            risk=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" --jq '[.[].name | select(startswith("risk:"))][0] // empty' || true)
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$msg${risk:+ · 이 PR 의 Risk: \`$risk\`}"
          fi

  # main 의 CI(test)가 실패하면 배포하지 않는다. 그 사실을 merge 된 PR 에 알린다(그러지 않으면 Actions 의 빨간 CI 로만 보인다).
  # 취소(cancelled)는 뒤이은 merge 가 대신 검사·배포하므로 알리지 않는다. CI 가 실패할 때만 도는 1분짜리 job 이고,
  # 실행은 실패로 끝난다("마지막 성공 배포" 로 집계되지 않게).
  ci-failed:
    name: Notify skipped deploy
    if: >-
      !github.event.repository.is_template
      && github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty' || true)
          msg="⏭️ main 검사(test)가 실패해 **배포하지 않았습니다** — 프로덕션은 이전 버전 그대로입니다. 고친 PR 을 merge 하면 그때 함께 배포됩니다. [CI 로그]($CI_URL)"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$msg"; fi
          # 실패로 끝낸다 — 이 실행이 "성공한 배포" 로 집계되면 다음 배포가 이 커밋을 이미 배포된 것으로 본다.
          exit 1
