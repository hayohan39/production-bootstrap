name: Claude Mention

# PR/이슈 코멘트에 @claude 를 붙이면 Claude 가 그 지시대로 작업한다.
# PR 리뷰 중 "merge 대신 수정 요청" 을 할 때 쓴다. (쓰기 권한이 있는 사람만 부를 수 있다.)
#
# 도구는 허용 목록으로 제한한다: 라벨·PR 상태·리뷰를 바꾸는 gh 명령은 쓸 수 없다
# (risk:* 라벨은 PR 리뷰만, merge 는 사람만 한다).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    # 사람이 시킨 작업이라 auto-fix 보다 넉넉히 둔다(--max-turns 60).
    timeout-minutes: 45
    # job 단위로 둔다: workflow 단위면 @claude 가 없는 코멘트(봇 코멘트 포함)의 실행도 같은 그룹에 들어가
    # 대기 중이던 @claude 실행을 밀어내고 취소시킨다. 건너뛴 job 은 그룹에 들어가지 않는다.
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || github.token }}

      # actions/checkout v6+ 는 토큰을 includeIf 로 포함한 별도 파일에 둔다. claude-code-action 은 로컬 설정과 include.path 의
      # extraheader 만 지우고 includeIf 는 못 봐서, Claude 의 push 가 App 토큰이 아니라 이 토큰(GITHUB_TOKEN = github-actions[bot])
      # 으로 나가고 그 커밋의 CI 가 "승인 대기(action_required)" 로 멈춘다. 토큰을 로컬 설정으로 옮겨 두면 action 이 PR 브랜치를
      # fetch 할 때는 쓰고, 그 뒤 지우고 자기 토큰(App 또는 BOT_PAT)으로 바꾼다. 값은 출력하지 않는다.
      - name: Hand checkout credentials to claude-code-action
        run: |
          key='http.https://github.com/.extraheader'
          value=$(git config --get "$key" || true)
          for k in $(git config --local --name-only --get-regexp '^includeif\.' || true); do git config --local --unset-all "$k"; done
          if [ -n "$value" ]; then git config --local "$key" "$value"; fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_PAT || '' }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
            --max-turns 60
            --allowed-tools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh run view:*),Read,Edit,Write,Glob,Grep,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            --disallowed-tools "Bash(git push --force:*),Bash(git push -f:*)"
